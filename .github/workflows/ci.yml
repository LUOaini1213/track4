name: offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      TECHJAM_DENSE_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reported numbers recomputed from committed sessions
        run: python -S -m unittest tests.test_reported_claims -v
      - name: Random-800 per-session reruns recounted
        run: python -S -m unittest tests.test_shard_sessions -v
      - name: No local machine paths in tracked files
        run: python -S -m unittest tests.test_no_local_paths -v
      - name: Standard-library tests without catalog or keys
        run: python -S -m unittest discover -s tests -v
      - name: Synthetic shopping dialogue
        run: python -S demo/fixture.py
      - name: Labelled session replayed on the committed catalog slice
        run: python -S demo/run_demo.py --session public_0002
